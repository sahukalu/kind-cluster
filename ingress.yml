apiVersion: networking.k8s.io/v1 
    kind: Ingress 
    metadata: 
      name: example-ingress 
    spec: 
      rules: 
      - host: example.com 
        http: 
          paths: 
          - path: /api/v1 
            pathType: Prefix 
            backend: 
              service: 
                name: api-v1-service 
                port: 
                  number: 80 
          - path: /api/v2 
            pathType: Prefix 
            backend: 
              service: 
                name: api-v2-service 
                port: 
                  number: 80

